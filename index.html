<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cartinha ❤️</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;
    background: #921820;
    font-family: Arial, sans-serif;
}

/* FUNDO */

.inicio {
    width: 100%;
    height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    background:
        repeating-linear-gradient(
            45deg,
            rgba(255,255,255,.035) 0px,
            rgba(255,255,255,.035) 35px,
            rgba(0,0,0,.025) 35px,
            rgba(0,0,0,.025) 70px
        ),
        #921820;
}

/* ENVELOPE */

.envelope {
    position: relative;

    width: min(88vw, 520px);
    height: min(62vw, 340px);

    cursor: pointer;

    filter: drop-shadow(0 16px 15px rgba(0,0,0,.3));

    animation: balanco 2.5s ease-in-out infinite;
}

@keyframes balanco {
    0%, 100% {
        transform: rotate(-1deg) translateY(0);
    }

    50% {
        transform: rotate(1deg) translateY(-7px);
    }
}

/* =========================
   FOLHA
   FICA DENTRO DO ENVELOPE
========================= */

.folha {
    position: absolute;

    left: 9%;

    width: 82%;
    height: 78%;

    /*
      Ela começa atrás do envelope.
      Não existe nenhuma parte branca
      visível no estado fechado.
    */

    bottom: 18%;

    background: #fffaf5;

    border: 2px solid #d8c0b7;
    border-radius: 4px;

    box-shadow: 0 4px 10px rgba(0,0,0,.15);

    z-index: 2;

    opacity: 0;

    transform: translateY(20px);

    transition:
        transform 1.35s cubic-bezier(.2,.8,.2,1),
        opacity .15s ease;

    display: flex;
    justify-content: center;
    align-items: center;
}

.folha::after {
    content: "💌";
    font-size: 42px;
}

/* =========================
   CORPO
========================= */

.envelope-corpo {
    position: absolute;

    left: 0;
    bottom: 0;

    width: 100%;
    height: 72%;

    background: #c92832;

    border: 4px solid #781017;

    border-radius: 9px;

    z-index: 3;
}

/* =========================
   FRENTE DO ENVELOPE
========================= */

.envelope-frente {
    position: absolute;

    left: 0;
    bottom: 0;

    width: 100%;
    height: 72%;

    background: #d5323b;

    /*
      As duas pontas superiores da frente
      descem até o centro.

      Isso fecha a abertura do envelope.
    */

    clip-path: polygon(
        0 0,
        50% 62%,
        100% 0,
        100% 100%,
        0 100%
    );

    z-index: 6;
}

/* =========================
   ABA SUPERIOR
========================= */

.aba {
    position: absolute;

    left: 0;

    /*
      A aba foi DESCIDA.
      Ela começa exatamente onde
      precisa fechar o envelope.
    */

    top: 17%;

    width: 100%;

    height: 61%;

    background: #e13a43;

    /*
      Ponta inferior da aba:
      vai até o centro do envelope.
    */

    clip-path: polygon(
        0 0,
        50% 100%,
        100% 0
    );

    z-index: 8;

    transform-origin: top center;

    transition:
        transform 1s cubic-bezier(.2,.8,.2,1);
}

/* borda escura da aba */

.aba-borda {
    position: absolute;

    left: 0;
    top: 17%;

    width: 100%;
    height: 61%;

    background: #781017;

    clip-path: polygon(
        0 0,
        50% 100%,
        100% 0
    );

    z-index: 7;

    transform-origin: top center;

    transition:
        transform 1s cubic-bezier(.2,.8,.2,1);
}

.aba-borda::after {
    content: "";

    position: absolute;

    left: 4px;
    top: 4px;

    width: calc(100% - 8px);
    height: calc(100% - 4px);

    background: #e13a43;

    clip-path: polygon(
        0 0,
        50% 100%,
        100% 0
    );
}

/* =========================
   ABERTURA
========================= */

.envelope.aberto {
    animation: none;
}

/*
   A aba abre para cima.
*/

.envelope.aberto .aba,
.envelope.aberto .aba-borda {
    transform: rotateX(180deg);
}

/*
   Só depois que a aba começa a abrir,
   a folha sai DE DENTRO do envelope.
*/

.envelope.aberto .folha {
    opacity: 1;

    transform: translateY(-150px);

    transition-delay: .35s;
}

/* =========================
   CELULAR
========================= */

@media (max-width: 600px) {

    .envelope {
        width: 90vw;
        height: 62vw;
    }

    .envelope.aberto .folha {
        transform: translateY(-110px);
    }
}
</style>
</head>

<body>

<section class="inicio">

    <div class="envelope" id="envelope">

        <!-- FOLHA ESCONDIDA DENTRO -->
        <div class="folha"></div>

        <!-- CORPO -->
        <div class="envelope-corpo"></div>

        <!-- FRENTE -->
        <div class="envelope-frente"></div>

        <!-- ABA SUPERIOR -->
        <div class="aba"></div>

        <!-- BORDA DA ABA -->
        <div class="aba-borda"></div>

    </div>

</section>

<script>

const envelope = document.getElementById("envelope");

envelope.addEventListener("click", function() {

    envelope.classList.add("aberto");

});

</script>

</body>
</html>
