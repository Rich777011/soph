<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cartinha ❤️</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    width: 100%;
    height: 100vh;
    overflow: hidden;
    background: #8f171e;
    font-family: Arial, sans-serif;
}

/* FUNDO */

.inicio {
    width: 100%;
    height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        repeating-linear-gradient(
            45deg,
            rgba(255,255,255,.035) 0px,
            rgba(255,255,255,.035) 35px,
            rgba(0,0,0,.025) 35px,
            rgba(0,0,0,.025) 70px
        ),
        #8f171e;
}

/* ENVELOPE */

.envelope {
    position: relative;

    width: min(86vw, 520px);
    height: min(58vw, 330px);

    cursor: pointer;

    filter: drop-shadow(0 18px 18px rgba(0,0,0,.30));

    transform: translateY(0);

    animation: flutuar 2.5s ease-in-out infinite;
}

@keyframes flutuar {

    0%, 100% {
        transform: translateY(0) rotate(-1deg);
    }

    50% {
        transform: translateY(-7px) rotate(1deg);
    }
}

/* CORPO DO ENVELOPE */

.envelope-base {
    position: absolute;

    left: 0;
    bottom: 0;

    width: 100%;
    height: 76%;

    background: #c92832;

    border: 4px solid #791017;

    border-radius: 8px;

    z-index: 2;
}

/* PAPEL */

.papel {
    position: absolute;

    left: 8%;
    bottom: 7%;

    width: 84%;
    height: 78%;

    background: #fffaf5;

    border: 2px solid #d7c0b7;

    border-radius: 4px;

    z-index: 3;

    transform: translateY(0);

    transition:
        transform 1.3s cubic-bezier(.18,.82,.25,1);

    box-shadow: 0 4px 12px rgba(0,0,0,.18);

    display: flex;
    align-items: center;
    justify-content: center;

    opacity: 0;
}

/* PAPEL SÓ APARECE DEPOIS DO CLIQUE */

.envelope.aberto .papel {
    opacity: 1;
    transform: translateY(-145px);
}

/* FRENTE DO ENVELOPE */

.envelope-frente {
    position: absolute;

    left: 0;
    bottom: 0;

    width: 100%;
    height: 76%;

    background: #d52f38;

    clip-path: polygon(
        0 0,
        50% 62%,
        100% 0,
        100% 100%,
        0 100%
    );

    border: 4px solid #791017;

    z-index: 5;
}

/* ABA SUPERIOR */

.aba {
    position: absolute;

    top: 2%;

    left: 0;

    width: 100%;
    height: 61%;

    background: #df353e;

    clip-path: polygon(
        0 0,
        50% 100%,
        100% 0
    );

    border: 4px solid #791017;

    transform-origin: top center;

    transform: rotateX(0deg);

    z-index: 7;

    transition:
        transform 1s cubic-bezier(.2,.8,.2,1);
}

/* ABERTURA */

.envelope.aberto {
    animation: none;
}

.envelope.aberto .aba {
    transform: rotateX(180deg);
}

/* TEXTO TEMPORÁRIO */

.instrucao {
    position: absolute;

    bottom: 9%;

    left: 50%;

    transform: translateX(-50%);

    color: white;

    font-size: 24px;

    font-style: italic;
}

/* CELULAR */

@media (max-width: 600px) {

    .envelope {
        width: 88vw;
        height: 59vw;
    }

    .envelope.aberto .papel {
        transform: translateY(-110px);
    }
}
</style>
</head>

<body>

<section class="inicio">

    <div class="envelope" id="envelope">

        <!-- papel escondido dentro -->
        <div class="papel"></div>

        <!-- corpo -->
        <div class="envelope-base"></div>

        <!-- frente -->
        <div class="envelope-frente"></div>

        <!-- aba que abre -->
        <div class="aba"></div>

    </div>

</section>

<script>

const envelope = document.getElementById("envelope");

envelope.addEventListener("click", function() {

    envelope.classList.add("aberto");

});

</script>

</body>
</html>
