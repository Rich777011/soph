<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cartinha ❤️</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #921820;
}


/* =========================
   FUNDO
========================= */

.inicio {
    position: relative;

    width: 100%;
    height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        repeating-linear-gradient(
            45deg,
            rgba(255,255,255,.035) 0px,
            rgba(255,255,255,.035) 35px,
            rgba(0,0,0,.025) 35px,
            rgba(0,0,0,.025) 70px
        ),
        #921820;
}


/* =========================
   ENVELOPE
========================= */

.envelope {
    position: relative;

    width: min(88vw, 540px);
    height: min(60vw, 350px);

    cursor: pointer;

    filter:
        drop-shadow(
            0 18px 16px rgba(0,0,0,.30)
        );

    animation:
        flutuar 2.5s ease-in-out infinite;

    z-index: 10;
}


@keyframes flutuar {

    0%,100% {
        transform:
            translateY(0)
            rotate(-1deg);
    }

    50% {
        transform:
            translateY(-7px)
            rotate(1deg);
    }
}


/* =========================
   CORPO
========================= */

.corpo {

    position: absolute;

    inset: 0;

    background: #cf3039;

    border: 5px solid #741017;

    border-radius: 11px;

    z-index: 1;
}


/* =========================
   CARTA
========================= */

.carta {

    position: absolute;

    left: 10%;

    width: 80%;

    height: 78%;

    /*
       COMEÇA COMPLETAMENTE
       ESCONDIDA DENTRO DO ENVELOPE
    */

    bottom: -45%;

    background: #fffaf5;

    border: 2px solid #d6bdb4;

    border-radius: 5px;

    box-shadow:
        0 5px 12px rgba(0,0,0,.18);

    z-index: 4;

    opacity: 0;

    transform:
        scale(1)
        translateY(0);

    transition:
        bottom 2.8s cubic-bezier(.22,.75,.2,1),
        opacity .25s ease;
}


/* coração da carta */

.carta::after {

    content: "💌";

    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    font-size: 42px;
}


/* =========================
   LATERAL ESQUERDA
========================= */

.esquerda {

    position: absolute;

    left: 5px;
    bottom: 5px;

    width: calc(50% - 5px);

    height: 68%;

    background: #d9343d;

    clip-path:
        polygon(
            0 0,
            100% 50%,
            100% 100%,
            0 100%
        );

    z-index: 6;
}


/* =========================
   LATERAL DIREITA
========================= */

.direita {

    position: absolute;

    right: 5px;
    bottom: 5px;

    width: calc(50% - 5px);

    height: 68%;

    background: #d9343d;

    clip-path:
        polygon(
            0 50%,
            100% 0,
            100% 100%,
            0 100%
        );

    z-index: 6;
}


/* =========================
   FRENTE
========================= */

.frente {

    position: absolute;

    left: 5px;
    bottom: 5px;

    width: calc(100% - 10px);

    height: 58%;

    background: #d9343d;

    clip-path:
        polygon(
            0 0,
            38% 0,
            50% 18%,
            62% 0,
            100% 0,
            100% 100%,
            0 100%
        );

    z-index: 7;
}


/* =========================
   ABA SUPERIOR
========================= */

.aba {

    position: absolute;

    left: 2px;
    top: 2px;

    width: calc(100% - 4px);

    height: 82%;

    background: #e13a43;

    clip-path:
        polygon(
            0 0,
            100% 0,
            50% 100%
        );

    border-radius:
        7px 7px 0 0;

    z-index: 10;

    transform-origin:
        top center;

    transition:
        transform 1.05s cubic-bezier(.2,.8,.2,1);
}


/* borda */

.aba::before {

    content: "";

    position: absolute;

    inset: 0;

    background: #741017;

    clip-path:
        polygon(
            0 0,
            100% 0,
            50% 100%
        );

    z-index: -1;
}


/* interior */

.aba::after {

    content: "";

    position: absolute;

    left: 5px;
    top: 5px;

    width: calc(100% - 10px);

    height: calc(100% - 5px);

    background: #e13a43;

    clip-path:
        polygon(
            0 0,
            100% 0,
            50% 100%
        );
}


/* =========================
   PRIMEIRA ETAPA
   CARTA SAI DO ENVELOPE
========================= */

.envelope.aberto .aba {

    transform:
        rotateX(180deg);
}


.envelope.aberto .carta {

    opacity: 1;

    /*
       Ela sobe devagar.
       Primeiro aparece somente
       a pontinha.
    */

    bottom: 60%;

    z-index: 20;

    transition:
        bottom 2.8s cubic-bezier(.22,.75,.2,1),
        opacity .25s ease;
}


/* =========================
   SEGUNDA ETAPA
   CARTA TOMA A TELA
========================= */

.envelope.carta-grande .carta {

    position: fixed;

    left: 5vw;
    top: 5vh;

    width: 90vw;
    height: 90vh;

    bottom: auto;

    transform:
        scale(1);

    z-index: 100;

    border-radius: 14px;

    box-shadow:
        0 15px 50px rgba(0,0,0,.35);

    transition:
        width 1.2s ease,
        height 1.2s ease,
        left 1.2s ease,
        top 1.2s ease,
        border-radius 1.2s ease;
}


/* envelope desaparece */

.envelope.carta-grande .corpo,
.envelope.carta-grande .frente,
.envelope.carta-grande .esquerda,
.envelope.carta-grande .direita,
.envelope.carta-grande .aba {

    opacity: 0;

    transition:
        opacity .8s ease;
}


/* =========================
   TEXTO
========================= */

.carta-texto {

    position: absolute;

    left: 8%;
    right: 8%;

    top: 10%;
    bottom: 10%;

    overflow-y: auto;

    color: #64151a;

    font-size: 21px;

    line-height: 1.6;

    text-align: left;

    opacity: 0;

    transition:
        opacity .8s ease;
}


.envelope.carta-grande .carta-texto {

    opacity: 1;

    transition-delay:
        1s;
}


/* =========================
   INSTRUÇÃO
========================= */

.instrucao {

    position: absolute;

    left: 50%;
    bottom: 7%;

    transform:
        translateX(-50%);

    color: white;

    font-size: 24px;

    font-style: italic;

    white-space: nowrap;

    z-index: 50;

    transition:
        opacity .5s ease;
}


.envelope.carta-grande + .instrucao {

    opacity: 0;
}


/* =========================
   CELULAR
========================= */

@media (max-width: 600px) {

    .envelope {

        width: 90vw;
        height: 61vw;
    }

    .carta-texto {

        font-size: 17px;

        line-height: 1.55;
    }
}

</style>
</head>


<body>

<section class="inicio">


    <div
        class="envelope"
        id="envelope"
    >


        <!-- CARTA -->

        <div class="carta">

            <div class="carta-texto">

                <p>
                    Seu texto vai aparecer aqui.
                </p>

            </div>

        </div>


        <!-- CORPO -->

        <div class="corpo"></div>


        <!-- LATERAIS -->

        <div class="esquerda"></div>

        <div class="direita"></div>


        <!-- FRENTE -->

        <div class="frente"></div>


        <!-- ABA -->

        <div class="aba"></div>


    </div>


    <div class="instrucao">

        clica aqui soph

    </div>


</section>


<script>

const envelope =
    document.getElementById("envelope");


let aberto = false;


envelope.addEventListener(
    "click",
    function() {

        if (!aberto) {

            aberto = true;

            /*
               PRIMEIRO:
               abre o envelope e
               começa a tirar a carta.
            */

            envelope.classList.add("aberto");


            /*
               DEPOIS que a carta
               terminou de sair,
               ela cresce e ocupa
               a tela.
            */

            setTimeout(function() {

                envelope.classList.add(
                    "carta-grande"
                );

            }, 3000);

        }

    }
);

</script>

</body>
</html>
