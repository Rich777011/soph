<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cartinha ❤️</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #921820;
}


/* =========================
   FUNDO
========================= */

.inicio {
    width: 100%;
    height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        repeating-linear-gradient(
            45deg,
            rgba(255,255,255,.035) 0px,
            rgba(255,255,255,.035) 35px,
            rgba(0,0,0,.025) 35px,
            rgba(0,0,0,.025) 70px
        ),
        #921820;
}


/* =========================
   ENVELOPE
========================= */

.envelope {
    position: relative;

    width: min(88vw, 540px);
    height: min(60vw, 350px);

    cursor: pointer;

    filter: drop-shadow(0 18px 16px rgba(0,0,0,.30));

    animation: flutuar 2.5s ease-in-out infinite;
}

@keyframes flutuar {

    0%, 100% {
        transform: translateY(0) rotate(-1deg);
    }

    50% {
        transform: translateY(-7px) rotate(1deg);
    }
}


/* =========================
   CORPO
========================= */

.corpo {
    position: absolute;

    inset: 0;

    background: #cf3039;

    border: 5px solid #741017;

    border-radius: 11px;

    z-index: 1;
}


/* =========================
   ÁREA INTERNA
   ESCONDE A CARTA
========================= */

.interno {
    position: absolute;

    left: 5px;
    right: 5px;
    bottom: 5px;

    height: 72%;

    overflow: hidden;

    z-index: 4;
}


/* =========================
   CARTA
========================= */

.carta {
    position: absolute;

    left: 10%;

    width: 80%;

    height: 78%;

    /*
       A carta começa BEM DENTRO
       do envelope.

       Não existe parte visível
       antes do clique.
    */

    bottom: -62%;

    background: #fffaf5;

    border: 2px solid #d6bdb4;

    border-radius: 5px;

    box-shadow:
        0 5px 12px rgba(0,0,0,.18);

    z-index: 5;

    transition:
        bottom 2.8s cubic-bezier(.25,.75,.2,1);
}


.carta::after {

    content: "💌";

    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    font-size: 42px;
}


/* =========================
   LATERAL ESQUERDA
========================= */

.esquerda {

    position: absolute;

    left: 5px;
    bottom: 5px;

    width: calc(50% - 5px);

    height: 68%;

    background: #d9343d;

    clip-path:
        polygon(
            0 0,
            100% 50%,
            100% 100%,
            0 100%
        );

    z-index: 6;
}


/* =========================
   LATERAL DIREITA
========================= */

.direita {

    position: absolute;

    right: 5px;
    bottom: 5px;

    width: calc(50% - 5px);

    height: 68%;

    background: #d9343d;

    clip-path:
        polygon(
            0 50%,
            100% 0,
            100% 100%,
            0 100%
        );

    z-index: 6;
}


/* =========================
   FRENTE
========================= */

.frente {

    position: absolute;

    left: 5px;
    bottom: 5px;

    width: calc(100% - 10px);

    height: 58%;

    background: #d9343d;

    clip-path:
        polygon(
            0 0,
            38% 0,
            50% 18%,
            62% 0,
            100% 0,
            100% 100%,
            0 100%
        );

    z-index: 7;
}


/* =========================
   ABA SUPERIOR
========================= */

.aba {

    position: absolute;

    left: 2px;
    top: 2px;

    width: calc(100% - 4px);

    height: 82%;

    background: #e13a43;

    clip-path:
        polygon(
            0 0,
            100% 0,
            50% 100%
        );

    border-radius:
        7px 7px 0 0;

    z-index: 10;

    transform-origin:
        top center;

    transition:
        transform 1.05s cubic-bezier(.2,.8,.2,1);
}


/* BORDA DA ABA */

.aba::before {

    content: "";

    position: absolute;

    inset: 0;

    background: #741017;

    clip-path:
        polygon(
            0 0,
            100% 0,
            50% 100%
        );

    z-index: -1;
}


/* INTERIOR DA ABA */

.aba::after {

    content: "";

    position: absolute;

    left: 5px;
    top: 5px;

    width: calc(100% - 10px);

    height: calc(100% - 5px);

    background: #e13a43;

    clip-path:
        polygon(
            0 0,
            100% 0,
            50% 100%
        );
}


/* =========================
   ABERTURA
========================= */

.envelope.aberto {

    animation: none;
}


/* ABA ABRE */

.envelope.aberto .aba {

    transform:
        rotateX(180deg);
}


/* =========================
   CARTA SAI DEVAGAR
========================= */

.envelope.aberto .carta {

    /*
       PRIMEIRA ETAPA:
       exatamente como estava.
       A carta começa dentro
       e aparece somente a pontinha.
    */

    bottom: 22%;

    transition:
        bottom 2.8s cubic-bezier(.25,.75,.2,1);
}


/* ==================================================
   SEGUNDA ETAPA
   CARTA SAI RETA PARA CIMA E CRESCE
================================================== */

.envelope.carta-saindo .interno {

    overflow: visible;
}


/*
   A carta continua exatamente
   no centro do envelope.

   NÃO vai para a direita.
   NÃO vai para a esquerda.

   Ela sobe reta.
*/

.envelope.carta-saindo .carta {

    position: fixed;

    left: 50%;

    bottom: 22%;

    width: 80%;

    height: 78%;

    transform: translateX(-50%);

    z-index: 20;

    transition:
        bottom 3.5s cubic-bezier(.2,.8,.2,1),
        width 3.5s cubic-bezier(.2,.8,.2,1),
        height 3.5s cubic-bezier(.2,.8,.2,1);
}


/*
   AGORA ELA CONTINUA SUBINDO
   E CRESCE ATÉ OCUPAR A TELA.
*/

.envelope.carta-tela .carta {

    left: 50%;

    bottom: 0;

    width: 100vw;

    height: 100vh;

    transform: translateX(-50%);

    border-radius: 0;

    z-index: 100;

    transition:
        bottom 3.5s cubic-bezier(.2,.8,.2,1),
        width 3.5s cubic-bezier(.2,.8,.2,1),
        height 3.5s cubic-bezier(.2,.8,.2,1),
        border-radius 1s ease;
}


/*
   ENVELOPE DESAPARECE
   QUANDO A CARTA CHEGA.
*/

.envelope.carta-tela .corpo,
.envelope.carta-tela .esquerda,
.envelope.carta-tela .direita,
.envelope.carta-tela .frente,
.envelope.carta-tela .aba {

    opacity: 0;

    transition:
        opacity 1s ease;
}


/* =========================
   TEXTO
========================= */

.instrucao {

    position: absolute;

    left: 50%;
    bottom: 7%;

    transform:
        translateX(-50%);

    color: white;

    font-size: 24px;

    font-style: italic;

    white-space: nowrap;

    transition:
        opacity .6s ease;
}


.envelope.carta-tela + .instrucao {

    opacity: 0;
}


/* =========================
   CELULAR
========================= */

@media (max-width: 600px) {

    .envelope {

        width: 90vw;
        height: 61vw;
    }

    .envelope.aberto .carta {

        bottom: 20%;
    }

    .envelope.carta-saindo .carta {

        left: 50%;

        width: 80%;

        height: 78%;

        transform: translateX(-50%);
    }

    .envelope.carta-tela .carta {

        left: 50%;

        bottom: 0;

        width: 100vw;

        height: 100vh;

        transform: translateX(-50%);
    }

    .instrucao {

        font-size: 22px;
    }
}

</style>
</head>


<body>

<section class="inicio">


    <div
        class="envelope"
        id="envelope"
    >


        <!-- ÁREA INTERNA DO ENVELOPE -->

        <div class="interno">

            <!-- CARTA DENTRO DO ENVELOPE -->

            <div class="carta"></div>

        </div>


        <!-- CORPO -->

        <div class="corpo"></div>


        <!-- LATERAIS -->

        <div class="esquerda"></div>

        <div class="direita"></div>


        <!-- FRENTE -->

        <div class="frente"></div>


        <!-- ABA SUPERIOR -->

        <div class="aba"></div>


    </div>


    <div class="instrucao">

        clica aqui soph

    </div>


</section>


<script>

const envelope =
    document.getElementById("envelope");


envelope.addEventListener(
    "click",
    function() {

        envelope.classList.add("aberto");


        /*
           PRIMEIRA ETAPA:
           espera a pontinha terminar
           de sair.
        */

        setTimeout(function() {

            envelope.classList.add(
                "carta-saindo"
            );


            /*
               SEGUNDA ETAPA:
               a carta sobe reta e
               cresce até ocupar a tela.
            */

            setTimeout(function() {

                envelope.classList.add(
                    "carta-tela"
                );

            }, 3500);

        }, 3000);

    }
);

</script>


</body>
</html>
