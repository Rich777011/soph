<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cartinha ❤️</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #921820;
}


/* =========================
   FUNDO
========================= */

.inicio {

    width: 100%;
    height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        repeating-linear-gradient(
            45deg,
            rgba(255,255,255,.035) 0px,
            rgba(255,255,255,.035) 35px,
            rgba(0,0,0,.025) 35px,
            rgba(0,0,0,.025) 70px
        ),
        #921820;
}


/* =========================
   ENVELOPE
========================= */

.envelope {

    position: relative;

    width: min(88vw, 540px);
    height: min(60vw, 350px);

    cursor: pointer;

    filter:
        drop-shadow(
            0 18px 16px rgba(0,0,0,.30)
        );

    animation:
        flutuar 2.5s ease-in-out infinite;
}


@keyframes flutuar {

    0%, 100% {
        transform:
            translateY(0)
            rotate(-1deg);
    }

    50% {
        transform:
            translateY(-7px)
            rotate(1deg);
    }
}


/* =========================
   CORPO DO ENVELOPE
========================= */

.corpo {

    position: absolute;

    inset: 0;

    background: #cf3039;

    border: 5px solid #741017;

    border-radius: 11px;

    z-index: 1;
}


/* =========================
   CARTA
========================= */

.carta {

    position: absolute;

    left: 10%;

    width: 80%;

    height: 78%;

    /*
       A carta começa escondida
       dentro do envelope.
    */

    left: 10%;
    bottom: 8%;

    background: #fffaf5;

    border: 2px solid #d6bdb4;

    border-radius: 5px;

    box-shadow:
        0 5px 12px rgba(0,0,0,.18);

    /*
       IMPORTANTE:
       enquanto fechado ela fica
       escondida atrás da frente.
    */

    z-index: 4;

    transform:
        translateY(65%);

    opacity: 0;

    transition:
        transform 1.4s cubic-bezier(.2,.8,.2,1),
        opacity .25s ease;
}


.carta::after {

    content: "💌";

    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    font-size: 42px;
}


/* =========================
   LATERAL ESQUERDA
========================= */

.esquerda {

    position: absolute;

    left: 5px;
    bottom: 5px;

    width: calc(50% - 5px);

    height: 68%;

    background: #d9343d;

    clip-path:
        polygon(
            0 0,
            100% 50%,
            100% 100%,
            0 100%
        );

    z-index: 6;
}


/* =========================
   LATERAL DIREITA
========================= */

.direita {

    position: absolute;

    right: 5px;
    bottom: 5px;

    width: calc(50% - 5px);

    height: 68%;

    background: #d9343d;

    clip-path:
        polygon(
            0 50%,
            100% 0,
            100% 100%,
            0 100%
        );

    z-index: 6;
}


/* =========================
   FRENTE DO ENVELOPE
========================= */

.frente {

    position: absolute;

    left: 5px;
    bottom: 5px;

    width: calc(100% - 10px);

    height: 58%;

    background: #d9343d;

    clip-path:
        polygon(
            0 0,
            50% 62%,
            100% 0,
            100% 100%,
            0 100%
        );

    z-index: 7;
}


/* =========================
   ABA SUPERIOR
========================= */

.aba {

    position: absolute;

    left: 2px;
    top: 2px;

    width: calc(100% - 4px);

    height: 82%;

    background: #e13a43;

    clip-path:
        polygon(
            0 0,
            100% 0,
            50% 100%
        );

    border-radius:
        7px 7px 0 0;

    z-index: 10;

    transform-origin:
        top center;

    transition:
        transform 1.05s cubic-bezier(.2,.8,.2,1);
}


/* BORDA DA ABA */

.aba::before {

    content: "";

    position: absolute;

    inset: 0;

    background: #741017;

    clip-path:
        polygon(
            0 0,
            100% 0,
            50% 100%
        );

    z-index: -1;
}


/* INTERIOR DA ABA */

.aba::after {

    content: "";

    position: absolute;

    left: 5px;
    top: 5px;

    width: calc(100% - 10px);

    height: calc(100% - 5px);

    background: #e13a43;

    clip-path:
        polygon(
            0 0,
            100% 0,
            50% 100%
        );
}


/* =========================
   ABRIR
========================= */

.envelope.aberto {

    animation: none;
}


/* ABA ABRE */

.envelope.aberto .aba {

    transform:
        rotateX(180deg);
}


/* =========================
   CARTA SAI
========================= */

/*
   Depois que o envelope abre,
   a carta sobe PARA A FRENTE.
*/

.envelope.aberto .carta {

    z-index: 20;

    opacity: 1;

    transform:
        translateY(-115px);

    transition-delay:
        .35s;
}


/* =========================
   TEXTO
========================= */

.instrucao {

    position: absolute;

    left: 50%;
    bottom: 7%;

    transform:
        translateX(-50%);

    color: white;

    font-size: 24px;

    font-style: italic;

    white-space: nowrap;
}


/* =========================
   CELULAR
========================= */

@media (max-width: 600px) {

    .envelope {

        width: 90vw;
        height: 61vw;
    }

    .envelope.aberto .carta {

        transform:
            translateY(-90px);
    }

    .instrucao {

        font-size: 22px;
    }
}

</style>

</head>


<body>

<section class="inicio">


    <div
        class="envelope"
        id="envelope"
    >


        <!-- CARTA -->
        <div class="carta"></div>


        <!-- CORPO -->
        <div class="corpo"></div>


        <!-- LATERAIS -->
        <div class="esquerda"></div>

        <div class="direita"></div>


        <!-- FRENTE -->
        <div class="frente"></div>


        <!-- ABA -->
        <div class="aba"></div>


    </div>


    <div class="instrucao">

        clica aqui soph

    </div>


</section>


<script>

const envelope =
    document.getElementById("envelope");


envelope.addEventListener(
    "click",
    function() {

        envelope.classList.add("aberto");

    }
);

</script>


</body>
</html>
