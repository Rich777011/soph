<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cartinha ❤️</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #921820;
}


/* =========================
   FUNDO
========================= */

.inicio {
    width: 100%;
    height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        repeating-linear-gradient(
            45deg,
            rgba(255,255,255,.035) 0px,
            rgba(255,255,255,.035) 35px,
            rgba(0,0,0,.025) 35px,
            rgba(0,0,0,.025) 70px
        ),
        #921820;
}


/* =========================
   ENVELOPE
========================= */

.envelope {
    position: relative;

    width: min(88vw, 540px);
    height: min(60vw, 350px);

    cursor: pointer;

    filter: drop-shadow(0 18px 16px rgba(0,0,0,.30));

    animation: flutuar 2.5s ease-in-out infinite;

    z-index: 10;
}

@keyframes flutuar {

    0%, 100% {
        transform: translateY(0) rotate(-1deg);
    }

    50% {
        transform: translateY(-7px) rotate(1deg);
    }
}


/* =========================
   CORPO
========================= */

.corpo {
    position: absolute;

    inset: 0;

    background: #cf3039;

    border: 5px solid #741017;

    border-radius: 11px;

    z-index: 1;
}


/* =========================
   ÁREA INTERNA
   ESCONDE A CARTA
========================= */

.interno {
    position: absolute;

    left: 5px;
    right: 5px;
    bottom: 5px;

    height: 72%;

    overflow: hidden;

    z-index: 4;
}


/* =========================
   CARTA
========================= */

.carta {
    position: absolute;

    left: 10%;

    width: 80%;

    height: 78%;

    bottom: -62%;

    background: #fffaf5;

    border: 2px solid #d6bdb4;

    border-radius: 5px;

    box-shadow:
        0 5px 12px rgba(0,0,0,.18);

    z-index: 5;

    transition:
        bottom 2.8s cubic-bezier(.25,.75,.2,1);
}


.carta::after {

    content: "💌";

    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    font-size: 42px;
}


/* =========================
   LATERAL ESQUERDA
========================= */

.esquerda {

    position: absolute;

    left: 5px;
    bottom: 5px;

    width: calc(50% - 5px);

    height: 68%;

    background: #d9343d;

    clip-path:
        polygon(
            0 0,
            100% 50%,
            100% 100%,
            0 100%
        );

    z-index: 6;
}


/* =========================
   LATERAL DIREITA
========================= */

.direita {

    position: absolute;

    right: 5px;
    bottom: 5px;

    width: calc(50% - 5px);

    height: 68%;

    background: #d9343d;

    clip-path:
        polygon(
            0 50%,
            100% 0,
            100% 100%,
            0 100%
        );

    z-index: 6;
}


/* =========================
   FRENTE
========================= */

.frente {

    position: absolute;

    left: 5px;
    bottom: 5px;

    width: calc(100% - 10px);

    height: 58%;

    background: #d9343d;

    clip-path:
        polygon(
            0 0,
            38% 0,
            50% 18%,
            62% 0,
            100% 0,
            100% 100%,
            0 100%
        );

    z-index: 7;
}


/* =========================
   ABA SUPERIOR
========================= */

.aba {

    position: absolute;

    left: 2px;
    top: 2px;

    width: calc(100% - 4px);

    height: 82%;

    background: #e13a43;

    clip-path:
        polygon(
            0 0,
            100% 0,
            50% 100%
        );

    border-radius:
        7px 7px 0 0;

    z-index: 10;

    transform-origin:
        top center;

    transition:
        transform 1.05s cubic-bezier(.2,.8,.2,1);
}


/* BORDA DA ABA */

.aba::before {

    content: "";

    position: absolute;

    inset: 0;

    background: #741017;

    clip-path:
        polygon(
            0 0,
            100% 0,
            50% 100%
        );

    z-index: -1;
}


/* INTERIOR DA ABA */

.aba::after {

    content: "";

    position: absolute;

    left: 5px;
    top: 5px;

    width: calc(100% - 10px);

    height: calc(100% - 5px);

    background: #e13a43;

    clip-path:
        polygon(
            0 0,
            100% 0,
            50% 100%
        );
}


/* =========================
   ABERTURA
========================= */

.envelope.aberto {

    animation: none;
}


/* ABA ABRE */

.envelope.aberto .aba {

    transform:
        rotateX(180deg);
}


/* =========================
   CARTA SAI DEVAGAR
   ESSA PARTE É A ORIGINAL
========================= */

.envelope.aberto .carta {

    bottom: 22%;

    transition:
        bottom 2.8s cubic-bezier(.25,.75,.2,1);
}


/* =================================================
   CONTINUAÇÃO DA ANIMAÇÃO
   DEPOIS QUE A PONTINHA SAI
================================================= */


/* libera a carta para continuar saindo */

.envelope.carta-completa .interno {

    overflow: visible;
}


/* carta continua subindo */

.envelope.carta-completa .carta {

    position: fixed;

    left: 5vw;
    top: 8vh;

    width: 90vw;
    height: 84vh;

    bottom: auto;

    z-index: 100;

    border-radius: 12px;

    transform: scale(1);

    transition:
        top 2s cubic-bezier(.2,.8,.2,1),
        left 2s cubic-bezier(.2,.8,.2,1),
        width 2s cubic-bezier(.2,.8,.2,1),
        height 2s cubic-bezier(.2,.8,.2,1),
        border-radius 2s ease;
}


/* envelope desaparece */

.envelope.carta-completa .corpo,
.envelope.carta-completa .esquerda,
.envelope.carta-completa .direita,
.envelope.carta-completa .frente,
.envelope.carta-completa .aba {

    opacity: 0;

    transition:
        opacity 1.2s ease;
}


/* =========================
   TEXTO DA CARTA
========================= */

.texto-carta {

    position: absolute;

    left: 8%;
    right: 8%;

    top: 8%;
    bottom: 8%;

    overflow-y: auto;

    color: #64151a;

    font-size: 19px;

    line-height: 1.6;

    text-align: left;

    opacity: 0;

    transition:
        opacity 1s ease;
}


/* texto aparece somente
   depois que a carta chega */

.envelope.carta-completa .texto-carta {

    opacity: 1;

    transition-delay: 1.8s;
}


/* =========================
   INSTRUÇÃO
========================= */

.instrucao {

    position: absolute;

    left: 50%;
    bottom: 7%;

    transform:
        translateX(-50%);

    color: white;

    font-size: 24px;

    font-style: italic;

    white-space: nowrap;

    z-index: 50;

    transition:
        opacity .6s ease;
}


.envelope.carta-completa + .instrucao {

    opacity: 0;
}


/* =========================
   CELULAR
========================= */

@media (max-width: 600px) {

    .envelope {

        width: 90vw;
        height: 61vw;
    }

    .envelope.carta-completa .carta {

        left: 5vw;

        top: 7vh;

        width: 90vw;

        height: 86vh;
    }

    .texto-carta {

        font-size: 17px;

        line-height: 1.55;
    }

    .instrucao {

        font-size: 22px;
    }
}

</style>
</head>


<body>

<section class="inicio">


    <div
        class="envelope"
        id="envelope"
    >


        <!-- ÁREA INTERNA DO ENVELOPE -->

        <div class="interno">

            <!-- CARTA DENTRO DO ENVELOPE -->

            <div class="carta">

                <div class="texto-carta">

                    <p>
                        Seu texto vai aparecer aqui.
                    </p>

                </div>

            </div>

        </div>


        <!-- CORPO -->

        <div class="corpo"></div>


        <!-- LATERAIS -->

        <div class="esquerda"></div>

        <div class="direita"></div>


        <!-- FRENTE -->

        <div class="frente"></div>


        <!-- ABA SUPERIOR -->

        <div class="aba"></div>


    </div>


    <div class="instrucao">

        clica aqui soph

    </div>


</section>


<script>

const envelope =
    document.getElementById("envelope");


let aberto = false;


envelope.addEventListener(
    "click",
    function() {

        if (aberto) return;

        aberto = true;


        /*
           PRIMEIRA ETAPA:
           exatamente a animação que
           você já tinha aprovado.
        */

        envelope.classList.add("aberto");


        /*
           Depois que a pontinha
           terminou de sair, começa
           a segunda etapa.
        */

        setTimeout(function() {

            envelope.classList.add(
                "carta-completa"
            );

        }, 3000);

    }
);

</script>


</body>
</html>
