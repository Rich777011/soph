<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cartinha ❤️</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;
    background: #921820;
    font-family: Arial, sans-serif;
}

/* FUNDO */

.inicio {
    width: 100%;
    height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        repeating-linear-gradient(
            45deg,
            rgba(255,255,255,.035) 0px,
            rgba(255,255,255,.035) 35px,
            rgba(0,0,0,.025) 35px,
            rgba(0,0,0,.025) 70px
        ),
        #921820;
}


/* ENVELOPE */

.envelope {
    position: relative;

    width: min(88vw, 540px);
    height: min(60vw, 350px);

    cursor: pointer;

    filter: drop-shadow(
        0 18px 16px rgba(0,0,0,.30)
    );

    animation: flutuar 2.5s ease-in-out infinite;
}

@keyframes flutuar {

    0%, 100% {
        transform: translateY(0) rotate(-1deg);
    }

    50% {
        transform: translateY(-7px) rotate(1deg);
    }
}


/* CARTA BRANCA */

.folha {
    position: absolute;

    width: 82%;
    height: 82%;

    left: 9%;

    /*
    A carta continua dentro do envelope.
    Ela fica escondida atrás do corpo
    enquanto o envelope está fechado.
    */

    bottom: 12%;

    background: #fffaf5;

    border: 2px solid #d8c1b7;

    border-radius: 5px;

    box-shadow:
        0 5px 12px rgba(0,0,0,.18);

    z-index: 2;

    display: flex;
    align-items: center;
    justify-content: center;

    /*
    Não aparece enquanto fechado.
    */

    opacity: 0;

    transform: translateY(0);

    transition:
        transform 1.35s cubic-bezier(.18,.82,.25,1),
        opacity .25s ease;
}

.folha::after {
    content: "💌";

    font-size: 42px;
}


/* CORPO DO ENVELOPE */

.envelope-corpo {
    position: absolute;

    left: 0;
    bottom: 0;

    width: 100%;
    height: 76%;

    background: #c92832;

    border: 4px solid #781017;

    border-radius: 9px;

    z-index: 3;
}


/* TRIÂNGULO DA FRENTE */

.envelope-frente {
    position: absolute;

    left: 0;
    bottom: 0;

    width: 100%;
    height: 76%;

    background: #d8323b;

    clip-path: polygon(
        0% 0%,
        50% 62%,
        100% 0%,
        100% 100%,
        0% 100%
    );

    z-index: 6;
}


/* =================================================
   ABA SUPERIOR DO ENVELOPE
   ================================================= */

/*
   AQUI ESTÁ A CORREÇÃO.

   O triângulo começa mais baixo e sua ponta
   desce até aproximadamente o centro do envelope.

   Assim ele cobre a carta branca quando fechado.
*/

.aba {
    position: absolute;

    left: 0;

    /*
    Antes estava muito para cima.
    Agora a aba começa mais abaixo.
    */

    top: 18px;

    width: 100%;

    /*
    Aba maior para fechar completamente.
    */

    height: 72%;

    background: #df353e;

    clip-path: polygon(
        0% 0%,
        50% 100%,
        100% 0%
    );

    z-index: 8;

    transform-origin: top center;

    transform: rotateX(0deg);

    transition:
        transform 1s cubic-bezier(.2,.8,.2,1);
}


/* BORDA DA ABA */

.aba-borda {
    position: absolute;

    left: 0;

    top: 18px;

    width: 100%;
    height: 72%;

    clip-path: polygon(
        0% 0%,
        50% 100%,
        100% 0%
    );

    background: #781017;

    z-index: 7;

    transform-origin: top center;

    transition:
        transform 1s cubic-bezier(.2,.8,.2,1);
}


/* parte interna da borda */

.aba-borda::after {

    content: "";

    position: absolute;

    left: 4px;
    top: 4px;

    width: calc(100% - 8px);
    height: calc(100% - 4px);

    background: #df353e;

    clip-path: polygon(
        0% 0%,
        50% 100%,
        100% 0%
    );
}


/* =================================================
   QUANDO CLICAR
   ================================================= */

.envelope.aberto {
    animation: none;
}


/*
   Primeiro a aba abre.
*/

.envelope.aberto .aba,
.envelope.aberto .aba-borda {

    transform: rotateX(180deg);
}


/*
   Depois a carta aparece e sobe.
*/

.envelope.aberto .folha {

    opacity: 1;

    transform: translateY(-145px);

    transition-delay: .35s;
}


/* TEXTO */

.instrucao {

    position: absolute;

    bottom: 8%;

    left: 50%;

    transform: translateX(-50%);

    color: white;

    font-size: 25px;

    font-style: italic;

    white-space: nowrap;
}


/* CELULAR */

@media (max-width: 600px) {

    .envelope {

        width: 90vw;
        height: 60vw;
    }

    .instrucao {

        font-size: 23px;
    }

    .envelope.aberto .folha {

        transform: translateY(-110px);
    }
}

</style>
</head>


<body>

<section class="inicio">

    <div class="envelope" id="envelope">

        <!-- CARTA BRANCA -->
        <div class="folha"></div>

        <!-- CORPO DO ENVELOPE -->
        <div class="envelope-corpo"></div>

        <!-- FRENTE -->
        <div class="envelope-frente"></div>

        <!-- ABA SUPERIOR -->
        <div class="aba"></div>

        <!-- BORDA DA ABA -->
        <div class="aba-borda"></div>

    </div>

    <div class="instrucao">
        clica aqui soph
    </div>

</section>


<script>

const envelope =
    document.getElementById("envelope");

envelope.addEventListener("click", function() {

    envelope.classList.add("aberto");

});

</script>

</body>
</html>
