<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cartinha ❤️</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #921820;
}

/* =========================
   FUNDO
========================= */

.inicio {
    width: 100%;
    height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    background:
        repeating-linear-gradient(
            45deg,
            rgba(255,255,255,0.035) 0px,
            rgba(255,255,255,0.035) 35px,
            rgba(0,0,0,0.025) 35px,
            rgba(0,0,0,0.025) 70px
        ),
        #921820;
}

/* =========================
   ENVELOPE
========================= */

.envelope {
    position: relative;

    width: min(88vw, 540px);
    height: min(60vw, 350px);

    cursor: pointer;

    filter: drop-shadow(0 18px 16px rgba(0,0,0,0.3));

    animation: flutuar 2.5s ease-in-out infinite;
}

@keyframes flutuar {
    0%, 100% {
        transform: translateY(0) rotate(-1deg);
    }

    50% {
        transform: translateY(-7px) rotate(1deg);
    }
}

/* =========================
   FOLHA
   FICA TOTALMENTE ESCONDIDA
========================= */

.folha {
    position: absolute;

    width: 82%;
    height: 82%;

    left: 9%;

    /*
      A folha começa BEM para baixo.
      Assim nenhuma parte branca aparece
      quando o envelope está fechado.
    */

    bottom: -28%;

    background: #fffaf5;

    border: 2px solid #d8c1b7;

    border-radius: 5px;

    box-shadow: 0 5px 12px rgba(0,0,0,0.18);

    z-index: 2;

    opacity: 0;

    transition:
        bottom 1.35s cubic-bezier(.2,.8,.2,1),
        opacity .2s ease;

    display: flex;
    align-items: center;
    justify-content: center;
}

.folha::after {
    content: "💌";

    font-size: 42px;
}

/* =========================
   CORPO DO ENVELOPE
========================= */

.envelope-corpo {
    position: absolute;

    left: 0;
    bottom: 0;

    width: 100%;
    height: 76%;

    background: #c92832;

    border: 4px solid #781017;

    border-radius: 9px;

    z-index: 3;
}

/* =========================
   FRENTE DO ENVELOPE
========================= */

.envelope-frente {
    position: absolute;

    left: 0;
    bottom: 0;

    width: 100%;
    height: 76%;

    background: #d8323b;

    /*
      As pontas laterais e a ponta
      central formam a frente do envelope.
    */

    clip-path: polygon(
        0% 0%,
        50% 58%,
        100% 0%,
        100% 100%,
        0% 100%
    );

    z-index: 6;
}

/* =========================
   ABA SUPERIOR
========================= */

.aba {
    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 62%;

    background: #e13a43;

    /*
      Triângulo superior.
      A ponta fica para baixo,
      fechando completamente o envelope.
    */

    clip-path: polygon(
        0% 0%,
        50% 100%,
        100% 0%
    );

    z-index: 8;

    transform-origin: top center;

    transition:
        transform 1s cubic-bezier(.2,.8,.2,1);
}

/* borda visual da aba */

.aba-borda {
    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 62%;

    clip-path: polygon(
        0% 0%,
        50% 100%,
        100% 0%
    );

    background: #781017;

    z-index: 7;

    transform-origin: top center;

    transition:
        transform 1s cubic-bezier(.2,.8,.2,1);
}

.aba-borda::after {
    content: "";

    position: absolute;

    left: 4px;
    top: 4px;

    width: calc(100% - 8px);
    height: calc(100% - 4px);

    background: #e13a43;

    clip-path: polygon(
        0% 0%,
        50% 100%,
        100% 0%
    );
}

/* =========================
   ABERTURA
========================= */

.envelope.aberto {
    animation: none;
}

/*
   Primeiro a aba abre.
*/

.envelope.aberto .aba,
.envelope.aberto .aba-borda {
    transform: rotateX(180deg);
}

/*
   A folha sobe somente depois
   que a aba começa a abrir.
*/

.envelope.aberto .folha {
    opacity: 1;

    bottom: 55%;

    transition-delay: .45s;
}

/* =========================
   TEXTO
========================= */

.instrucao {
    position: absolute;

    bottom: 8%;

    left: 50%;

    transform: translateX(-50%);

    color: white;

    font-size: 25px;

    font-style: italic;

    white-space: nowrap;
}

/* =========================
   CELULAR
========================= */

@media (max-width: 600px) {

    .envelope {
        width: 90vw;
        height: 60vw;
    }

    .instrucao {
        font-size: 23px;
    }

    .envelope.aberto .folha {
        bottom: 55%;
    }
}
</style>
</head>

<body>

<section class="inicio">

    <div class="envelope" id="envelope">

        <!--
            FOLHA:
            começa completamente escondida
            atrás do envelope
        -->
        <div class="folha"></div>

        <!-- corpo do envelope -->
        <div class="envelope-corpo"></div>

        <!-- frente do envelope -->
        <div class="envelope-frente"></div>

        <!-- aba superior -->
        <div class="aba"></div>

        <!-- borda da aba -->
        <div class="aba-borda"></div>

    </div>

    <div class="instrucao">
        clica aqui soph
    </div>

</section>

<script>

const envelope = document.getElementById("envelope");

envelope.addEventListener("click", function () {

    envelope.classList.add("aberto");

});

</script>

</body>
</html>
