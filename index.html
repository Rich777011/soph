<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cartinha ❤️</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;
    background: #921820;
    font-family: Arial, sans-serif;
}

.inicio {
    width: 100%;
    height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    background:
        repeating-linear-gradient(
            45deg,
            rgba(255,255,255,.035) 0px,
            rgba(255,255,255,.035) 35px,
            rgba(0,0,0,.025) 35px,
            rgba(0,0,0,.025) 70px
        ),
        #921820;
}

/* =========================
   ENVELOPE
========================= */

.envelope {
    position: relative;

    width: min(88vw, 540px);
    height: min(60vw, 350px);

    cursor: pointer;

    filter: drop-shadow(0 18px 16px rgba(0,0,0,.30));

    animation: flutuar 2.5s ease-in-out infinite;
}

@keyframes flutuar {
    0%, 100% {
        transform: translateY(0) rotate(-1deg);
    }

    50% {
        transform: translateY(-7px) rotate(1deg);
    }
}

/* =========================
   BASE INTEIRA
========================= */

.base {
    position: absolute;

    inset: 0;

    background: #cf3039;

    border: 5px solid #741017;

    border-radius: 10px;

    z-index: 1;
}

/*
   Esta camada fecha completamente
   a abertura do envelope.
*/

.fechamento {
    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 72%;

    background: #d9343d;

    border-radius: 6px 6px 0 0;

    z-index: 4;
}

/* =========================
   FOLHA ESCONDIDA
========================= */

.folha {
    position: absolute;

    left: 8%;

    width: 84%;
    height: 78%;

    bottom: 10%;

    background: #fffaf5;

    border: 2px solid #d6bdb4;

    border-radius: 5px;

    box-shadow: 0 5px 12px rgba(0,0,0,.18);

    z-index: 3;

    opacity: 0;

    transform: translateY(20px);

    transition:
        transform 1.4s cubic-bezier(.2,.8,.2,1),
        opacity .2s ease;
}

.folha::after {
    content: "💌";

    font-size: 42px;
}

/* =========================
   FRENTE DO ENVELOPE
========================= */

.frente {
    position: absolute;

    left: 0;
    bottom: 0;

    width: 100%;
    height: 67%;

    background: #d9343d;

    clip-path: polygon(
        0 0,
        50% 58%,
        100% 0,
        100% 100%,
        0 100%
    );

    z-index: 6;
}

/* =========================
   ABA SUPERIOR
========================= */

.aba {
    position: absolute;

    left: -1%;
    top: 0;

    width: 102%;

    /*
      Mais baixa para fechar
      completamente as laterais.
    */

    height: 72%;

    background: #e13a43;

    clip-path: polygon(
        0 0,
        100% 0,
        50% 100%
    );

    z-index: 8;

    transform-origin: top center;

    transition:
        transform 1s cubic-bezier(.2,.8,.2,1);
}

/*
   Borda da aba.
*/

.aba::before {
    content: "";

    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    background: #741017;

    clip-path: polygon(
        0 0,
        100% 0,
        50% 100%
    );

    z-index: -1;
}

.aba::after {
    content: "";

    position: absolute;

    left: 5px;
    top: 5px;

    width: calc(100% - 10px);
    height: calc(100% - 5px);

    background: #e13a43;

    clip-path: polygon(
        0 0,
        100% 0,
        50% 100%
    );
}

/* =========================
   ABRIR
========================= */

.envelope.aberto {
    animation: none;
}

.envelope.aberto .aba {
    transform: rotateX(180deg);
}

.envelope.aberto .folha {
    opacity: 1;

    transform: translateY(-155px);

    transition-delay: .4s;
}

/* =========================
   INSTRUÇÃO
========================= */

.instrucao {
    position: absolute;

    left: 50%;
    bottom: 7%;

    transform: translateX(-50%);

    color: white;

    font-size: 24px;

    font-style: italic;

    white-space: nowrap;
}

/* =========================
   CELULAR
========================= */

@media (max-width: 600px) {

    .envelope {
        width: 90vw;
        height: 61vw;
    }

    .envelope.aberto .folha {
        transform: translateY(-110px);
    }

    .instrucao {
        font-size: 22px;
    }
}
</style>
</head>

<body>

<section class="inicio">

    <div class="envelope" id="envelope">

        <!-- folha que está dentro -->
        <div class="folha"></div>

        <!-- base fechada -->
        <div class="base"></div>

        <!-- fechamento vermelho -->
        <div class="fechamento"></div>

        <!-- frente -->
        <div class="frente"></div>

        <!-- aba superior -->
        <div class="aba"></div>

    </div>

    <div class="instrucao">
        clica aqui soph
    </div>

</section>

<script>

const envelope = document.getElementById("envelope");

envelope.addEventListener("click", function() {

    envelope.classList.add("aberto");

});

</script>

</body>
</html>
